<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173e46">
  <title>換気風量測定</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18353b;
      --muted: #64777b;
      --line: #d8e2e2;
      --paper: #fff;
      --back: #f2f6f5;
      --teal: #1b6870;
      --teal-dark: #164e56;
      --mint: #e6f2f0;
      --red: #b4232e;
      --red-bg: #fff0f0;
      --green: #17643e;
      --green-bg: #eaf6ef;
      --shadow: 0 8px 24px rgba(26, 59, 64, .06);
    }
    * { box-sizing: border-box; }
    html { background: var(--back); }
    body {
      margin: 0;
      padding: 0 14px max(24px, env(safe-area-inset-bottom));
      color: var(--ink);
      background: var(--back);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-size: 17px;
      line-height: 1.55;
      -webkit-text-size-adjust: 100%;
    }
    body.locked { overflow: hidden; }
    .page { width: 100%; max-width: 720px; margin: 0 auto; }
    .topbar {
      margin: 0 -14px 18px;
      padding: 22px 18px 19px;
      color: #fff;
      background: var(--teal-dark);
      border-bottom: 4px solid #77b8ac;
    }
    .topbar-inner { max-width: 684px; margin: 0 auto; }
    .eyebrow { margin: 0 0 4px; color: #b8d9d3; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0; font-size: 28px; line-height: 1.25; letter-spacing: .03em; }
    .top-note { margin: 9px 0 0; color: #d6e9e6; font-size: 14px; }
    .local-state { display: inline-flex; gap: 7px; align-items: center; margin-top: 12px; padding: 6px 11px; color: #eafffa; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; font-size: 13px; }
    .local-dot { width: 8px; height: 8px; background: #9de0c5; border-radius: 50%; }
    .card { margin: 0 0 15px; padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow); }
    .section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 15px; }
    .section-number { display: grid; width: 30px; height: 30px; place-items: center; flex: 0 0 30px; color: #fff; background: var(--teal); border-radius: 9px; font-size: 15px; font-weight: 800; }
    h2 { margin: 0; font-size: 19px; letter-spacing: .02em; }
    h3 { display: flex; align-items: center; gap: 9px; margin: 17px 0 11px; font-size: 16px; }
    .hint { margin: 7px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .hint.error { color: var(--red); font-weight: 700; }
    .condition-item { margin-bottom: 12px; padding: 13px; background: #f7faf9; border: 1px solid #e1eae8; border-radius: 12px; }
    .condition-item:last-child { margin-bottom: 0; }
    .item-head { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-bottom: 11px; }
    .item-title { color: #2b555a; font-size: 15px; font-weight: 800; }
    .remove-button { min-height: 40px; padding: 7px 11px; color: #9b2730; background: #fff0f0; border: 0; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 800; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { min-width: 0; }
    label { display: block; margin-bottom: 7px; color: #405c61; font-size: 15px; font-weight: 700; }
    .unit { color: var(--muted); font-size: 13px; font-weight: 500; }
    input, select {
      display: block;
      width: 100%;
      min-height: 56px;
      padding: 12px 14px;
      color: var(--ink);
      background: #fbfdfc;
      border: 1px solid #cbd9d9;
      border-radius: 10px;
      outline: none;
      font: inherit;
      font-size: 19px;
    }
    input:focus, select:focus { border-color: #36838a; box-shadow: 0 0 0 3px rgba(45, 127, 132, .13); background: #fff; }
    input::placeholder { color: #a5b4b5; }
    select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #557479 50%), linear-gradient(135deg, #557479 50%, transparent 50%); background-position: calc(100% - 19px) 24px, calc(100% - 13px) 24px; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
    .condition-result { margin: 9px 0 0; color: #3b6569; font-size: 14px; font-weight: 700; }
    .primary, .secondary, .clear-button, .popup-button {
      min-height: 54px;
      padding: 11px 15px;
      border: 0;
      border-radius: 11px;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .primary { color: #fff; background: var(--teal); box-shadow: 0 4px 10px rgba(27,104,112,.17); }
    .primary:active { background: #15575e; }
    .secondary { color: #34565b; background: #eaf0ef; }
    .add-condition { width: 100%; margin-top: 12px; color: var(--teal-dark); background: #e6f2f0; }
    .total-strip { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding: 13px; background: #e9f3f1; border: 1px solid #c9dfdb; border-radius: 11px; }
    .total-strip span { font-size: 14px; font-weight: 700; }
    .total-strip strong { color: var(--teal-dark); font-size: 22px; font-variant-numeric: tabular-nums; text-align: right; }
    .fan-card { scroll-margin-top: 12px; }
    .fan-head { display: flex; justify-content: space-between; align-items: center; gap: 9px; margin-bottom: 12px; }
    .fan-title { margin: 0; font-size: 19px; }
    .sub-head { display: flex; align-items: center; gap: 9px; margin: 13px 0 10px; font-size: 16px; font-weight: 800; }
    .shape-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .shape-choice { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 58px; padding: 10px; color: #34565b; background: #f4f8f7; border: 1px solid #d8e3e1; border-radius: 11px; font: inherit; font-size: 16px; font-weight: 800; }
    .shape-choice.selected { color: var(--teal-dark); background: #e6f2f0; border: 2px solid #36838a; }
    .shape-symbol { font-size: 24px; line-height: 1; }
    .selection-note { margin: 10px 0 0; padding: 12px; color: var(--muted); background: #f7f9f8; border-radius: 10px; font-size: 14px; text-align: center; }
    .area-box, .average-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 11px; padding: 12px; background: #f3f8f7; border-radius: 10px; }
    .area-box span, .average-box span { color: #587075; font-size: 14px; font-weight: 700; }
    .area-box strong, .average-box strong { color: var(--teal-dark); font-size: 19px; font-variant-numeric: tabular-nums; }
    .speed-list { display: grid; gap: 9px; }
    .speed-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 9px; align-items: center; }
    .speed-index { display: grid; width: 30px; height: 30px; place-items: center; color: #2f6c70; background: var(--mint); border-radius: 50%; font-size: 14px; font-weight: 800; }
    .speed-row input { min-height: 54px; }
    .speed-unit { color: var(--muted); font-size: 14px; }
    .measure-button { width: 100%; margin-top: 14px; }
    .fan-note { min-height: 1.5em; margin: 8px 1px 0; color: var(--muted); font-size: 13px; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .summary-tile { min-height: 90px; padding: 13px; background: #f4f8f7; border: 1px solid #e0eae8; border-radius: 12px; }
    .summary-tile span { display: block; color: #587075; font-size: 14px; font-weight: 700; }
    .summary-tile strong { display: block; margin-top: 5px; color: var(--teal-dark); font-size: 24px; line-height: 1.3; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .summary-tile.full { grid-column: 1 / -1; }
    .summary-tile.full strong { font-size: clamp(29px, 8vw, 38px); }
    .summary-tile.low { background: var(--red-bg); border-color: #efb9bd; }
    .summary-tile.low strong { color: var(--red); }
    .summary-status { display: none; margin-top: 11px; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 800; }
    .summary-status.show { display: block; }
    .summary-status.low { color: #9b1722; background: #ffe1e3; }
    .summary-status.ok { color: var(--green); background: var(--green-bg); }
    .formula-note { margin: 12px 0 0; padding: 11px 12px; color: #526b70; background: #f7f9f8; border-radius: 9px; font-size: 14px; }
    .clear-button { width: 100%; margin-top: 14px; color: #34565b; background: #eaf0ef; }
    .footer-note { margin: 18px 6px 4px; color: #718488; text-align: center; font-size: 13px; }
    .popup-backdrop { position: fixed; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(13, 36, 41, .58); }
    .popup-backdrop.visible { display: flex; }
    .popup-card { width: min(100%, 480px); max-height: min(90vh, 760px); overflow-y: auto; padding: 21px 18px 18px; background: #fff; border: 1px solid #d8e2e2; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.22); text-align: center; }
    .popup-kicker { margin: 0 0 5px; color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    .popup-card h2 { margin: 0 0 13px; font-size: 22px; }
    .popup-fan-list { display: grid; gap: 7px; margin: 0 0 12px; text-align: left; }
    .popup-fan-row { padding: 9px 11px; color: #34565b; background: #f4f8f7; border-radius: 9px; font-size: 14px; font-weight: 700; }
    .popup-total { display: flex; justify-content: space-between; gap: 10px; padding: 11px 2px; border-top: 1px solid #e4ebea; text-align: left; }
    .popup-total span { color: #587075; font-size: 14px; font-weight: 700; }
    .popup-total strong { color: var(--teal-dark); font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
    .popup-total.measured strong { font-size: 25px; }
    .popup-status { margin: 12px 0 15px; padding: 13px 10px; color: var(--green); background: var(--green-bg); border-radius: 11px; font-size: 17px; font-weight: 900; }
    .popup-status.low { color: var(--red); background: #ffe1e3; }
    .popup-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .popup-button { min-height: 54px; padding: 9px; font-size: 15px; }
    .popup-ok { color: #34565b; background: #eaf0ef; }
    .popup-add { grid-column: 1 / -1; color: #fff; background: var(--teal); }
    .popup-reset { color: #9b1722; background: #ffe7e8; }
    @media (max-width: 390px) {
      body { padding-right: 10px; padding-left: 10px; }
      .topbar { margin-right: -10px; margin-left: -10px; padding-right: 15px; padding-left: 15px; }
      .card { padding: 15px; }
      .fields { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr; }
      .summary-tile.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="eyebrow">FIELD MEASUREMENT</p>
      <h1>換気風量測定</h1>
      <p class="top-note">換気条件と換気扇ごとの測定値を入力します。</p>
      <span class="local-state"><span class="local-dot"></span>入力内容はこの端末に保存</span>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <div class="section-head"><span class="section-number">1</span><h2>換気条件</h2></div>
      <div id="conditionsContainer"></div>
      <button id="addConditionButton" class="primary add-condition" type="button">＋ 換気条件を追加</button>
      <div class="total-strip"><span>必要有効換気量（合計）</span><strong id="requiredTotal">—</strong></div>
      <p id="conditionHint" class="hint" role="status"></p>
    </section>

    <div id="fansContainer"></div>

    <section class="card">
      <div class="section-head"><span class="section-number">4</span><h2>合計結果</h2></div>
      <div class="summary-grid">
        <div class="summary-tile">
          <span>必要有効換気量（合計）</span>
          <strong id="summaryRequired">—</strong>
        </div>
        <div class="summary-tile full" id="summaryMeasuredTile">
          <span>測定風量（測定済み換気扇の合計）</span>
          <strong id="summaryMeasured">—</strong>
        </div>
      </div>
      <div id="summaryStatus" class="summary-status" role="status"></div>
      <p class="formula-note">必要有効換気量 ＝ 各発熱量 × 0.93 × 換気型式の合計 ／ 各換気扇の測定風量 ＝ 3,600 × 開口面積 × 5点の平均風速</p>
      <button id="clearButton" class="clear-button" type="button">全データをリセット</button>
    </section>
    <p class="footer-note">測定値はクラウドへ送信せず、この端末のブラウザに一時保存します。</p>
  </main>

  <div id="resultPopup" class="popup-backdrop" aria-hidden="true">
    <section class="popup-card" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <p class="popup-kicker">測定結果</p>
      <h2 id="popupTitle">換気風量の合計</h2>
      <div id="popupFanList" class="popup-fan-list"></div>
      <div class="popup-total"><span>必要有効換気量（合計）</span><strong id="popupRequired">—</strong></div>
      <div class="popup-total measured"><span>測定風量（全台合計）</span><strong id="popupMeasured">—</strong></div>
      <div id="popupStatus" class="popup-status"></div>
      <div class="popup-actions">
        <button id="popupOk" class="popup-button popup-ok" type="button">OK</button>
        <button id="popupReset" class="popup-button popup-reset" type="button">リセット</button>
        <button id="popupAddFan" class="popup-button popup-add" type="button">換気扇を追加</button>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var storageKey = 'ventFlowMeasurementDraftV3';
      var oldStorageKey = 'ventFlowMeasurementDraftV2';
      var validTypes = ['40', '30', '20', '2'];
      var appState = createBlankState();

      function createBlankFan() {
        return { shape: '', diameter: '', height: '', width: '', speeds: ['', '', '', '', ''], measuredFlow: null };
      }
      function createBlankState() {
        return { conditions: [{ heat: '', type: '30' }], fans: [createBlankFan()] };
      }
      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      }
      function parseNumber(input) {
        var text = String(input == null ? '' : input).trim();
        if (!text) return null;
        text = text
          .replace(/[０-９]/g, function (character) { return String.fromCharCode(character.charCodeAt(0) - 65248); })
          .replace(/[．。]/g, '.')
          .replace(/[，,\s]/g, '');
        if (!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(text)) return NaN;
        var number = Number(text);
        return isFinite(number) ? number : NaN;
      }
      function formatted(number, digits) {
        if (number === null || number === undefined || !isFinite(number)) return '—';
        return new Intl.NumberFormat('ja-JP', { maximumFractionDigits: digits, minimumFractionDigits: 0 }).format(number);
      }
      function appendUnitValue(node, number, digits, unit) {
        node.textContent = formatted(number, digits);
        var unitNode = el('span', 'unit', unit);
        node.appendChild(unitNode);
      }
      function makeTextField(labelText, unitText, value, placeholder, dataset) {
        var field = el('div', 'field');
        var label = el('label', '', labelText);
        if (unitText) label.appendChild(el('span', 'unit', ' (' + unitText + ')'));
        var input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'decimal';
        input.autocomplete = 'off';
        input.autocapitalize = 'off';
        input.spellcheck = false;
        input.placeholder = placeholder || '数値を入力';
        input.value = value || '';
        Object.keys(dataset || {}).forEach(function (key) { input.dataset[key] = dataset[key]; });
        field.appendChild(label);
        field.appendChild(input);
        return field;
      }
      function makeTypeField(value, index) {
        var field = el('div', 'field');
        var label = el('label', '', '換気型式');
        var select = document.createElement('select');
        select.dataset.conditionIndex = String(index);
        select.dataset.conditionField = 'type';
        [['40', '40'], ['30', '30（標準）'], ['20', '20'], ['2', '2']].forEach(function (entry) {
          var option = document.createElement('option');
          option.value = entry[0];
          option.textContent = entry[1];
          if (entry[0] === String(value || '30')) option.selected = true;
          select.appendChild(option);
        });
        field.appendChild(label);
        field.appendChild(select);
        return field;
      }
      function calculateConditions() {
        var rows = appState.conditions.map(function (condition) {
          var heat = parseNumber(condition.heat);
          var type = Number(condition.type);
          var valid = heat !== null && !isNaN(heat) && heat >= 0 && validTypes.indexOf(String(condition.type)) >= 0;
          return { valid: valid, required: valid ? heat * 0.93 * type : null };
        });
        var allValid = rows.length > 0 && rows.every(function (row) { return row.valid; });
        return {
          rows: rows,
          ready: allValid,
          total: allValid ? rows.reduce(function (sum, row) { return sum + row.required; }, 0) : null
        };
      }
      function calculateFan(fan) {
        var area = null;
        if (fan.shape === 'circle') {
          var diameter = parseNumber(fan.diameter);
          if (diameter !== null && !isNaN(diameter) && diameter >= 0) {
            var radiusCm = diameter / 2;
            area = radiusCm * radiusCm * 3.14 / 10000;
          }
        } else if (fan.shape === 'rectangle') {
          var height = parseNumber(fan.height);
          var width = parseNumber(fan.width);
          if (height !== null && !isNaN(height) && height >= 0 && width !== null && !isNaN(width) && width >= 0) {
            area = height * width / 10000;
          }
        }
        var speedValues = fan.speeds.map(parseNumber);
        var speedsReady = speedValues.length === 5 && speedValues.every(function (speed) {
          return speed !== null && !isNaN(speed) && speed >= 0;
        });
        var average = speedsReady
          ? speedValues.reduce(function (sum, speed) { return sum + speed; }, 0) / speedValues.length
          : null;
        var flow = area !== null && average !== null ? area * average * 3600 : null;
        return { area: area, average: average, flow: flow, ready: area !== null && average !== null };
      }
      function renderConditions() {
        var container = document.getElementById('conditionsContainer');
        container.textContent = '';
        appState.conditions.forEach(function (condition, index) {
          var card = el('div', 'condition-item');
          var head = el('div', 'item-head');
          head.appendChild(el('div', 'item-title', '換気条件 ' + (index + 1)));
          if (appState.conditions.length > 1) {
            var remove = el('button', 'remove-button', '削除');
            remove.type = 'button';
            remove.dataset.action = 'remove-condition';
            remove.dataset.index = String(index);
            head.appendChild(remove);
          }
          var fields = el('div', 'fields');
          fields.appendChild(makeTextField('発熱量', 'kW', condition.heat, '例：3.5', { conditionIndex: String(index), conditionField: 'heat' }));
          fields.appendChild(makeTypeField(condition.type, index));
          var rowResult = el('p', 'condition-result', '必要有効換気量：—');
          rowResult.dataset.conditionResult = String(index);
          card.appendChild(head);
          card.appendChild(fields);
          card.appendChild(rowResult);
          container.appendChild(card);
        });
        refreshConditions();
      }
      function buildFanCard(fan, index) {
        var card = el('section', 'card fan-card');
        card.dataset.fanCard = String(index);
        var head = el('div', 'fan-head');
        head.appendChild(el('h2', 'fan-title', '換気扇 ' + (index + 1) + '台目'));
        if (index > 0) {
          var removeFan = el('button', 'remove-button', 'この換気扇を削除');
          removeFan.type = 'button';
          removeFan.dataset.action = 'remove-fan';
          removeFan.dataset.index = String(index);
          head.appendChild(removeFan);
        }
        card.appendChild(head);

        var shapeHead = el('div', 'sub-head');
        shapeHead.appendChild(el('span', 'section-number', '2'));
        shapeHead.appendChild(document.createTextNode('開口部の形状'));
        card.appendChild(shapeHead);

        var choices = el('div', 'shape-choices');
        [['circle', '〇', '円形'], ['rectangle', '□', '四角形']].forEach(function (entry) {
          var choice = el('button', 'shape-choice' + (fan.shape === entry[0] ? ' selected' : ''), '');
          choice.type = 'button';
          choice.dataset.action = 'select-shape';
          choice.dataset.index = String(index);
          choice.dataset.shape = entry[0];
          choice.setAttribute('aria-pressed', fan.shape === entry[0] ? 'true' : 'false');
          choice.appendChild(el('span', 'shape-symbol', entry[1]));
          choice.appendChild(document.createTextNode(entry[2]));
          choices.appendChild(choice);
        });
        card.appendChild(choices);

        if (!fan.shape) {
          card.appendChild(el('p', 'selection-note', '〇または□を選ぶと、開口部と実測風速の入力欄が表示されます。'));
          return card;
        }

        var dimensionFields = el('div', 'fields');
        if (fan.shape === 'circle') {
          dimensionFields.appendChild(makeTextField('直径', 'cm', fan.diameter, '例：20', { fanIndex: String(index), fanField: 'diameter' }));
        } else {
          dimensionFields.appendChild(makeTextField('開口部タテ', 'cm', fan.height, '例：31', { fanIndex: String(index), fanField: 'height' }));
          dimensionFields.appendChild(makeTextField('開口部ヨコ', 'cm', fan.width, '例：29', { fanIndex: String(index), fanField: 'width' }));
        }
        card.appendChild(dimensionFields);

        var areaBox = el('div', 'area-box');
        areaBox.appendChild(el('span', '', '開口部面積'));
        var areaValue = el('strong', '', '—');
        areaValue.dataset.fanArea = String(index);
        areaBox.appendChild(areaValue);
        card.appendChild(areaBox);

        var speedHead = el('div', 'sub-head');
        speedHead.appendChild(el('span', 'section-number', '3'));
        speedHead.appendChild(document.createTextNode('実測風速 (m/s)・5点'));
        card.appendChild(speedHead);
        card.appendChild(el('p', 'hint', '各測定点の風速を入力します。5点の平均から換気風量を計算します。'));

        var speedList = el('div', 'speed-list');
        fan.speeds.forEach(function (speed, speedIndex) {
          var row = el('div', 'speed-row');
          row.appendChild(el('span', 'speed-index', String(speedIndex + 1)));
          var input = document.createElement('input');
          input.type = 'text';
          input.inputMode = 'decimal';
          input.autocomplete = 'off';
          input.autocapitalize = 'off';
          input.spellcheck = false;
          input.placeholder = (speedIndex + 1) + '点目';
          input.value = speed || '';
          input.setAttribute('aria-label', (index + 1) + '台目 実測風速 ' + (speedIndex + 1) + '点目');
          input.dataset.fanIndex = String(index);
          input.dataset.speedIndex = String(speedIndex);
          row.appendChild(input);
          row.appendChild(el('span', 'speed-unit', 'm/s'));
          speedList.appendChild(row);
        });
        card.appendChild(speedList);

        var averageBox = el('div', 'average-box');
        averageBox.appendChild(el('span', '', '5点の平均風速'));
        var averageValue = el('strong', '', '—');
        averageValue.dataset.fanAverage = String(index);
        averageBox.appendChild(averageValue);
        card.appendChild(averageBox);

        var measureButton = el('button', 'primary measure-button', '測定風量を表示');
        measureButton.type = 'button';
        measureButton.dataset.action = 'measure-flow';
        measureButton.dataset.index = String(index);
        card.appendChild(measureButton);
        var note = el('p', 'fan-note', '形状・寸法・実測風速5点を入力すると表示できます。');
        note.dataset.fanNote = String(index);
        card.appendChild(note);
        return card;
      }
      function renderFans() {
        var container = document.getElementById('fansContainer');
        container.textContent = '';
        appState.fans.forEach(function (fan, index) {
          container.appendChild(buildFanCard(fan, index));
        });
        refreshFanCards();
      }
      function refreshConditions() {
        var totals = calculateConditions();
        totals.rows.forEach(function (row, index) {
          var node = document.querySelector('[data-condition-result="' + index + '"]');
          if (node) node.textContent = '必要有効換気量：' + (row.valid ? formatted(row.required, 2) + ' m³/h' : '入力待ち');
        });
        var totalNode = document.getElementById('requiredTotal');
        totalNode.textContent = totals.ready ? formatted(totals.total, 2) + ' m³/h' : '入力待ち';
        var hint = document.getElementById('conditionHint');
        hint.className = 'hint';
        hint.textContent = totals.ready
          ? '追加した換気条件の必要有効換気量を合計しています。'
          : 'すべての換気条件に発熱量を入力すると、必要有効換気量の合計が表示されます。';
      }
      function refreshFanCards() {
        appState.fans.forEach(function (fan, index) {
          var card = document.querySelector('[data-fan-card="' + index + '"]');
          if (!card) return;
          var metrics = calculateFan(fan);
          var areaNode = card.querySelector('[data-fan-area]');
          var averageNode = card.querySelector('[data-fan-average]');
          var button = card.querySelector('[data-action="measure-flow"]');
          var note = card.querySelector('[data-fan-note]');
          if (!button || !note) return;
          if (areaNode) appendUnitValue(areaNode, metrics.area, 4, '㎡');
          if (averageNode) appendUnitValue(averageNode, metrics.average, 2, 'm/s');
          var conditionsReady = calculateConditions().ready;
          button.disabled = !metrics.ready || !conditionsReady;
          if (!conditionsReady) {
            note.textContent = '先に、すべての換気条件の発熱量を入力してください。';
          } else if (!metrics.ready) {
            note.textContent = '形状・寸法・実測風速5点を入力すると表示できます。';
          } else if (fan.measuredFlow !== null && fan.measuredFlow !== undefined) {
            note.textContent = '測定済み：' + formatted(fan.measuredFlow, 2) + ' m³/h';
          } else {
            note.textContent = '入力がそろいました。「測定風量を表示」を押してください。';
          }
        });
      }
      function refreshSummary() {
        var conditionMetrics = calculateConditions();
        var completed = appState.fans.filter(function (fan) { return typeof fan.measuredFlow === 'number' && isFinite(fan.measuredFlow); });
        var measuredTotal = completed.reduce(function (sum, fan) { return sum + fan.measuredFlow; }, 0);
        document.getElementById('summaryRequired').textContent = conditionMetrics.ready ? formatted(conditionMetrics.total, 2) + ' m³/h' : '入力待ち';
        document.getElementById('summaryMeasured').textContent = completed.length ? formatted(measuredTotal, 2) + ' m³/h' : '—';
        var tile = document.getElementById('summaryMeasuredTile');
        var status = document.getElementById('summaryStatus');
        tile.classList.remove('low');
        status.className = 'summary-status';
        status.textContent = '';
        if (conditionMetrics.ready && completed.length) {
          if (measuredTotal < conditionMetrics.total) {
            tile.classList.add('low');
            status.textContent = '測定風量の合計が必要有効換気量を下回っています';
            status.className = 'summary-status show low';
          } else {
            status.textContent = '測定風量の合計が必要有効換気量以上です';
            status.className = 'summary-status show ok';
          }
        }
      }
      function refreshAll() {
        refreshConditions();
        refreshFanCards();
        refreshSummary();
      }
      function saveDraft() {
        try { localStorage.setItem(storageKey, JSON.stringify(appState)); } catch (error) {}
      }
      function normalizeState(saved) {
        var normalized = createBlankState();
        if (Array.isArray(saved.conditions) && saved.conditions.length) {
          normalized.conditions = saved.conditions.map(function (condition) {
            var type = String(condition.type || '30');
            return { heat: String(condition.heat == null ? '' : condition.heat), type: validTypes.indexOf(type) >= 0 ? type : '30' };
          });
        }
        if (Array.isArray(saved.fans) && saved.fans.length) {
          normalized.fans = saved.fans.map(function (fan) {
            var speeds = Array.isArray(fan.speeds) ? fan.speeds.slice(0, 5).map(function (value) { return String(value == null ? '' : value); }) : [];
            while (speeds.length < 5) speeds.push('');
            var flow = typeof fan.measuredFlow === 'number' && isFinite(fan.measuredFlow) ? fan.measuredFlow : null;
            return {
              shape: fan.shape === 'circle' || fan.shape === 'rectangle' ? fan.shape : '',
              diameter: String(fan.diameter == null ? '' : fan.diameter),
              height: String(fan.height == null ? '' : fan.height),
              width: String(fan.width == null ? '' : fan.width),
              speeds: speeds,
              measuredFlow: flow
            };
          });
        }
        return normalized;
      }
      function restoreDraft() {
        try {
          var current = JSON.parse(localStorage.getItem(storageKey) || 'null');
          if (current) {
            appState = normalizeState(current);
            return;
          }
          var old = JSON.parse(localStorage.getItem(oldStorageKey) || 'null');
          if (!old) return;
          appState.conditions = [{ heat: String(old.heat || ''), type: validTypes.indexOf(String(old.type || '30')) >= 0 ? String(old.type || '30') : '30' }];
          if (old.width || old.height || old.speeds) {
            var fan = createBlankFan();
            if (old.width || old.height) {
              fan.shape = 'rectangle';
              fan.height = String(old.width || '');
              fan.width = String(old.height || '');
            }
            if (Array.isArray(old.speeds)) fan.speeds = old.speeds.slice(0, 5).map(function (value) { return String(value || ''); });
            while (fan.speeds.length < 5) fan.speeds.push('');
            appState.fans = [fan];
          }
          saveDraft();
        } catch (error) {}
      }
      function showFanResult(index) {
        var conditionMetrics = calculateConditions();
        if (!conditionMetrics.ready) {
          document.getElementById('conditionHint').textContent = '必要有効換気量を計算するため、すべての発熱量を入力してください。';
          document.getElementById('conditionHint').classList.add('error');
          document.getElementById('conditionsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
          return;
        }
        var fan = appState.fans[index];
        var metrics = calculateFan(fan);
        if (!metrics.ready) return;
        fan.measuredFlow = metrics.flow;
        saveDraft();
        refreshAll();
        renderPopup();
        openPopup();
      }
      function renderPopup() {
        var list = document.getElementById('popupFanList');
        list.textContent = '';
        var measuredFans = appState.fans.map(function (fan, index) {
          return { fan: fan, index: index };
        }).filter(function (item) {
          return typeof item.fan.measuredFlow === 'number' && isFinite(item.fan.measuredFlow);
        });
        measuredFans.forEach(function (item) {
          list.appendChild(el('div', 'popup-fan-row', (item.index + 1) + '台目の換気風量：' + formatted(item.fan.measuredFlow, 2) + ' m³/h'));
        });
        var conditions = calculateConditions();
        var totalMeasured = measuredFans.reduce(function (sum, item) { return sum + item.fan.measuredFlow; }, 0);
        document.getElementById('popupRequired').textContent = conditions.ready ? formatted(conditions.total, 2) + ' m³/h' : '—';
        document.getElementById('popupMeasured').textContent = measuredFans.length ? formatted(totalMeasured, 2) + ' m³/h' : '—';
        var status = document.getElementById('popupStatus');
        status.classList.remove('low');
        if (conditions.ready && measuredFans.length && totalMeasured < conditions.total) {
          status.textContent = '測定風量の合計が必要有効換気量を下回っています';
          status.classList.add('low');
        } else {
          status.textContent = '測定風量の合計が必要有効換気量以上です';
        }
      }
      function openPopup() {
        document.getElementById('resultPopup').classList.add('visible');
        document.getElementById('resultPopup').setAttribute('aria-hidden', 'false');
        document.body.classList.add('locked');
      }
      function closePopup() {
        document.getElementById('resultPopup').classList.remove('visible');
        document.getElementById('resultPopup').setAttribute('aria-hidden', 'true');
        document.body.classList.remove('locked');
      }
      function addFan() {
        closePopup();
        appState.fans.push(createBlankFan());
        renderFans();
        refreshAll();
        saveDraft();
        var newCard = document.querySelector('[data-fan-card="' + (appState.fans.length - 1) + '"]');
        if (newCard) newCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      function resetAll(skipConfirmation) {
        if (!skipConfirmation && !window.confirm('すべての換気条件と測定値を消去しますか？')) return;
        appState = createBlankState();
        try {
          localStorage.removeItem(storageKey);
          localStorage.removeItem(oldStorageKey);
        } catch (error) {}
        closePopup();
        renderConditions();
        renderFans();
        refreshAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      var conditionsContainer = document.getElementById('conditionsContainer');
      var fansContainer = document.getElementById('fansContainer');
      conditionsContainer.addEventListener('input', function (event) {
        var input = event.target;
        if (input.dataset.conditionIndex === undefined) return;
        var index = Number(input.dataset.conditionIndex);
        var field = input.dataset.conditionField;
        if (appState.conditions[index]) appState.conditions[index][field] = input.value;
        refreshAll();
        saveDraft();
      });
      conditionsContainer.addEventListener('change', function (event) {
        var input = event.target;
        if (input.dataset.conditionIndex === undefined) return;
        var index = Number(input.dataset.conditionIndex);
        var field = input.dataset.conditionField;
        if (appState.conditions[index]) appState.conditions[index][field] = input.value;
        refreshAll();
        saveDraft();
      });
      conditionsContainer.addEventListener('click', function (event) {
        var button = event.target.closest('button[data-action="remove-condition"]');
        if (!button) return;
        appState.conditions.splice(Number(button.dataset.index), 1);
        if (!appState.conditions.length) appState.conditions.push({ heat: '', type: '30' });
        renderConditions();
        refreshAll();
        saveDraft();
      });
      document.getElementById('addConditionButton').addEventListener('click', function () {
        appState.conditions.push({ heat: '', type: '30' });
        renderConditions();
        refreshAll();
        saveDraft();
        var lastCondition = conditionsContainer.lastElementChild;
        if (lastCondition) lastCondition.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      fansContainer.addEventListener('input', function (event) {
        var input = event.target;
        if (input.dataset.fanIndex === undefined) return;
        var fan = appState.fans[Number(input.dataset.fanIndex)];
        if (!fan) return;
        if (input.dataset.speedIndex !== undefined) fan.speeds[Number(input.dataset.speedIndex)] = input.value;
        else if (input.dataset.fanField) fan[input.dataset.fanField] = input.value;
        fan.measuredFlow = null;
        refreshAll();
        saveDraft();
      });
      fansContainer.addEventListener('click', function (event) {
        var button = event.target.closest('button[data-action]');
        if (!button) return;
        var index = Number(button.dataset.index);
        if (button.dataset.action === 'select-shape') {
          var fan = appState.fans[index];
          if (!fan) return;
          fan.shape = button.dataset.shape;
          fan.measuredFlow = null;
          renderFans();
          refreshAll();
          saveDraft();
        } else if (button.dataset.action === 'measure-flow') {
          showFanResult(index);
        } else if (button.dataset.action === 'remove-fan') {
          if (!window.confirm((index + 1) + '台目の換気扇データを削除しますか？')) return;
          appState.fans.splice(index, 1);
          if (!appState.fans.length) appState.fans.push(createBlankFan());
          renderFans();
          refreshAll();
          saveDraft();
        }
      });
      document.getElementById('popupOk').addEventListener('click', closePopup);
      document.getElementById('popupAddFan').addEventListener('click', addFan);
      document.getElementById('popupReset').addEventListener('click', function () { resetAll(true); });
      document.getElementById('clearButton').addEventListener('click', function () { resetAll(false); });
      document.getElementById('resultPopup').addEventListener('click', function (event) {
        if (event.target === document.getElementById('resultPopup')) closePopup();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closePopup();
      });

      restoreDraft();
      renderConditions();
      renderFans();
      refreshAll();
    })();
  </script>
</body>
</html>
