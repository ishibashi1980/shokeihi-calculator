<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>諸経費計算機</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;padding:18px 14px 28px}
h1{text-align:center;font-size:24px;margin:8px 0 18px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #0000000d;margin-bottom:14px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
input{width:100%;font-size:26px;text-align:right;padding:13px;border:2px solid #dbe2ec;border-radius:12px;outline:0}
input:focus{border-color:#2563eb}
.clear{border:0;border-radius:12px;padding:14px;font-size:19px;font-weight:700;background:#e9eef7;color:#24324a}
.operators{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:10px}
.operators button{border:0;border-radius:10px;padding:11px 4px;font-size:21px;font-weight:700;background:#dbeafe;color:#1d4ed8;touch-action:manipulation}
.result{display:grid;gap:9px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid #edf0f5}
.row:last-child{border:0}
.name{color:#596579}.value{font-weight:800;font-variant-numeric:tabular-nums}
.expense-row{margin:2px -8px;padding:13px 10px;background:#eff6ff;border:1px solid #dbeafe;border-radius:12px}
.expense-row .name{font-weight:700;color:#1d4ed8}
.expense-row .name small{display:block;margin-top:3px;font-size:12px;font-weight:400;color:#596579}
.expense-row .value{font-size:19px;color:#1d4ed8}
.total{font-size:21px;color:#2563eb}
.clear{width:100%;margin-top:10px;background:#2563eb;color:#fff}
.note{font-size:12px;color:#6b7280;line-height:1.6;margin-top:10px}
.error{min-height:1.5em;color:#b42318}
</style>
</head>
<body>
<main class="app">
<h1>💰 諸経費計算機</h1>

<section class="card">
<label for="amount">全体の金額（小計）</label>
<input id="amount" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例：1000+2000-1000" aria-describedby="input-note input-error">
<div class="operators" aria-label="計算記号">
<button type="button" onpointerdown="event.preventDefault()" onclick="insertOperator('+')" aria-label="足し算">＋</button>
<button type="button" onpointerdown="event.preventDefault()" onclick="insertOperator('-')" aria-label="引き算">−</button>
<button type="button" onpointerdown="event.preventDefault()" onclick="insertOperator('×')" aria-label="掛け算">×</button>
<button type="button" onpointerdown="event.preventDefault()" onclick="insertOperator('÷')" aria-label="割り算">÷</button>
<button type="button" onpointerdown="event.preventDefault()" onclick="insertOperator('(')" aria-label="左括弧">(</button>
<button type="button" onpointerdown="event.preventDefault()" onclick="insertOperator(')')" aria-label="右括弧">)</button>
</div>
<button class="clear" type="button" onclick="calculateExpression()">計算</button>
<div class="note" id="input-note">数字はキーボードから、＋、−、×、÷、括弧は上のボタンから入力できます。入力後「計算」を押してください。</div>
<div class="note error" id="input-error" role="status" aria-live="polite"></div>
</section>

<section class="card">
<div class="result">
<div class="row"><span class="name">A：小計</span><span class="value" id="a">¥0</span></div>
<div class="row"><span class="name">B：15％</span><span class="value" id="b">¥0</span></div>
<div class="row"><span class="name">C：1,000円単位で繰り上げ</span><span class="value" id="c">¥0</span></div>
<div class="row expense-row"><span class="name">諸経費（C − A）<small>繰上げ後の金額 − 小計</small></span><span class="value" id="expense">¥0</span></div>
<div class="row"><span class="name">中計</span><span class="value" id="subtotal">¥0</span></div>
<div class="row"><span class="name">値引き（×0.2）</span><span class="value" id="discount">¥0</span></div>
<div class="row"><span class="name">値引後小計（中計 − 値引き）</span><span class="value" id="discountedSubtotal">¥0</span></div>
<div class="row"><span class="name">消費税（10％）</span><span class="value" id="tax">¥0</span></div>
<div class="row total"><span>合計</span><span class="value" id="total">¥0</span></div>
</div>
<div class="note">Bは小計Aの115％、Cは1,000円単位で切り上げます。諸経費はC−A、中計はCです。中計の20％を値引きし、値引後小計に消費税10％を加えて合計を表示します。</div>
</section>
</main>

<script>
const amount=document.getElementById('amount');
const errorMessage=document.getElementById('input-error');

function fmt(n){return '¥'+Math.round(n).toLocaleString('ja-JP')}
function roundup1000(n){return Math.ceil(n/1000)*1000}

// 許可した演算子と括弧だけを読む再帰下降パーサー。コードとしては実行しない。
function parseExpression(input){
  if(input.length>200) throw new Error('式が長すぎます（200文字以内で入力してください）。');
  const s=input.replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/．/g,'.').replace(/[＋]/g,'+').replace(/[−ー]/g,'-')
    .replace(/[×xX]/g,'*').replace(/[÷]/g,'/');
  let i=0;
  function skipSpaces(){while(/\s/.test(s[i]||'')&&i<s.length)i++;}
  function expression(){
    let value=term();
    while(true){skipSpaces();const op=s[i];if(op!=='+'&&op!=='-')return value;i++;const rhs=term();value=op==='+'?value+rhs:value-rhs;}
  }
  function term(){
    let value=unary();
    while(true){skipSpaces();const op=s[i];if(op!=='*'&&op!=='/')return value;i++;const rhs=unary();if(op==='/'&&rhs===0)throw new Error('0で割ることはできません。');value=op==='*'?value*rhs:value/rhs;}
  }
  function unary(){skipSpaces();if(s[i]==='+'||s[i]==='-'){const op=s[i++];const value=unary();return op==='-'?-value:value;}return primary();}
  function primary(){
    skipSpaces();
    if(s[i]==='('){i++;const value=expression();skipSpaces();if(s[i]!==')')throw new Error('括弧の対応を確認してください。');i++;return value;}
    const rest=s.slice(i);const match=rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)/);
    if(!match)throw new Error('計算できる式を入力してください。');
    i+=match[0].length;return Number(match[0]);
  }
  skipSpaces();if(i===s.length)throw new Error('金額または計算式を入力してください。');
  const result=expression();skipSpaces();
  if(i!==s.length)throw new Error('式に使えない文字があります。');
  if(!Number.isFinite(result))throw new Error('計算結果が大きすぎます。');
  return result;
}

function currentAmount(){
  const raw=amount.value.trim();
  if(!raw)return 0;
  try{return parseExpression(raw)}catch{return 0;}
}
function update(){
  const a=currentAmount();
  const b=a*1.15;
  const c=roundup1000(b);
  const e=c-a;
  const discount=c*0.2;
  const discountedSubtotal=c-discount;
  const tax=discountedSubtotal*0.10;
  const total=discountedSubtotal+tax;
  document.getElementById('a').textContent=fmt(a);
  document.getElementById('b').textContent=fmt(b);
  document.getElementById('c').textContent=fmt(c);
  document.getElementById('expense').textContent=fmt(e);
  document.getElementById('subtotal').textContent=fmt(c);
  document.getElementById('discount').textContent=fmt(discount);
  document.getElementById('discountedSubtotal').textContent=fmt(discountedSubtotal);
  document.getElementById('tax').textContent=fmt(tax);
  document.getElementById('total').textContent=fmt(total);
}
function insertOperator(symbol){
  const start=amount.selectionStart??amount.value.length;
  const end=amount.selectionEnd??start;
  amount.value=amount.value.slice(0,start)+symbol+amount.value.slice(end);
  const cursor=start+symbol.length;
  amount.focus();
  amount.setSelectionRange(cursor,cursor);
  errorMessage.textContent='';
  update();
}
function calculateExpression(){
  try{
    const value=parseExpression(amount.value.trim());
    amount.value=String(value);
    errorMessage.textContent='';
    update();
  }catch(error){
    errorMessage.textContent=error.message||'式を確認してください。';
    amount.focus();
  }
}
amount.addEventListener('input',()=>{errorMessage.textContent='';update()});
update();
</script>
</body>
</html>
